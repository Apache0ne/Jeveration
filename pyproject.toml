[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apache0ne-jeveration"
version = "0.1.0"
description = "Jeveration inference and decoder-side RGBD distillation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = [
  "torch>=2.7.1",
  "transformers==5.12.1",
  "tokenizers==0.22.2",
  "huggingface_hub==1.13.0",
  "safetensors==0.8.0",
  "open_clip_torch==3.3.0",
  "omegaconf==2.3.0",
  "einops==0.8.1",
  "numpy>=2.1,<3",
  "pillow>=11,<13",
  "flash-linear-attention==0.5.2",
  "datasets>=3,<5",
  "tqdm>=4.66,<5",
  "tensorboard>=2.16,<3",
  "h5py>=3.10,<4",
  "scikit-image>=0.24,<1",
]

[project.scripts]
jeveration-rgbd = "jeveration.rgbd_train:main"

[tool.setuptools]
packages = ["jeveration"]
include-package-data = true

[tool.setuptools.package-data]
jeveration = [
  "third_party/tatitok/modeling/*.py",
  "third_party/tatitok/modeling/modules/*.py",
  "third_party/tatitok/LICENSE",
]
